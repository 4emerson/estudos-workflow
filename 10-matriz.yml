name: Matriz

on:
  push:
     paths:
        - '.gitea/workflows/10-matriz.yml'

jobs:
  versoes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    container:
      image: python:${{ matrix.python }}-slim
    steps:
      - name: Versão do Python
        run: python --version
